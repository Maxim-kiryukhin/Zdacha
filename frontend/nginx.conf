# Блок 1: Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name tasteandtradition.ru www.tasteandtradition.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Блок 2: Основной сервер HTTPS
server {
    listen 443 ssl;
    server_name tasteandtradition.ru www.tasteandtradition.ru;

    # Пути к сертификатам внутри контейнера (docker-compose)
    ssl_certificate /etc/letsencrypt/live/tasteandtradition.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasteandtradition.ru/privkey.pem;

    # Базовая безопасность SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /MEDIA/ {
        alias /app/MEDIA/;
    }

    # Проксируем запросы к API на Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Чтобы Django понял, что запрос шел через HTTPS
        proxy_set_header X-Forwarded-Proto $scheme; 
    }

    # Проксируем админку
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксируем статику админки
    location /static/ {
        alias /app/static/;
    }
}